<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethera | Zero-Latency Browser AI Engine</title>
    <!-- Tailwind CSS د چټک ډیزاین لپاره -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 p-4 flex justify-between items-center bg-slate-900/50 backdrop-blur">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl">A</div>
            <h1 class="text-xl font-bold tracking-wide">Aethera Engine <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded border border-blue-500/30">v0.1-Alpha</span></h1>
        </div>
        <div id="gpu-status" class="flex items-center gap-2 text-sm bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span class="text-slate-400">د WebGPU د حالت ارزونه...</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-6">
        
        <!-- Left Panel: Engine Controls -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col gap-4">
            <h2 class="text-lg font-bold text-slate-200 border-b border-slate-800 pb-2">د انجن تنظیمات (Engine Control)</h2>
            
            <div>
                <label class="block text-sm text-slate-400 mb-2">د AI ماډل انتخاب کړه:</label>
                <select id="model-select" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 transition">
                    <option value="qwen-0.5b">Qwen 0.5B (Lightweight - Fast)</option>
                    <option value="llama3-8b-4bit">Llama 3 8B (Quantized 4-bit)</option>
                </select>
            </div>

            <button id="btn-init" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition duration-200 flex justify-center items-center gap-2 shadow-lg shadow-blue-600/20">
                🚀 د محلي انجن لوډول (Init Engine)
            </button>

            <!-- Hardware Telemetry Dashboard -->
            <div class="mt-auto border-t border-slate-800 pt-4">
                <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">د هارډویر ژوندی حالت (Hardware Metrics)</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                        <span class="text-xs text-slate-400 block">RAM مصرف</span>
                        <span id="ram-usage" class="text-lg font-bold text-blue-400">0.0 GB</span>
                    </div>
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                        <span class="text-xs text-slate-400 block">GPU فعاليت</span>
                        <span id="gpu-usage" class="text-lg font-bold text-emerald-400">Inactive</span>
                    </div>
                </div>
            </div>
            <!-- index.html په برخو کې دا اضافه کړئ -->
<div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 mt-3">
    <span class="text-xs text-slate-400 block">پروسس سرعت (Inference Speed)</span>
    <span id="tps-speed" class="text-lg font-bold text-yellow-400">0.0 TPS</span>
</div>
        </section>

        <!-- Right Panel: Execution & Output Playground -->
        <section class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col">
            <h2 class="text-lg font-bold text-slate-200 border-b border-slate-800 pb-2 mb-4">محلي اجراء (Inference Console)</h2>
            
            <!-- Output Window -->
            <div id="output-box" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-sm text-slate-300 overflow-y-auto min-h-[250px] mb-4">
                <p class="text-slate-600">// د سیسټم پیغامونه او محلي AI ځوابونه به دلته ښودل کېږي...</p>
            </div>

            <!-- Input Controls -->
            <div class="flex gap-2">
                <input id="user-input" type="text" placeholder="خپله پوښتنه يا امر دلته ولیکئ..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition" disabled>
                <button id="btn-send" class="bg-slate-800 text-slate-500 font-medium px-6 py-3 rounded-xl cursor-not-allowed" disabled>لېږل</button>
            </div>
        </section>

    </main>

    <!-- JS Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
